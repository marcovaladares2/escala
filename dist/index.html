<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123a63">
    <title>Escala Pediatria</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23123a63'/%3E%3Cpath d='M18 18h28v29H18z' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M24 12v12M40 12v12M25 33h14M32 26v14' stroke='%230bd0c3' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body>
    <section class="brand-hero" aria-labelledby="brand-title">
      <video class="hero-video" autoplay loop muted playsinline webkit-playsinline preload="auto" aria-hidden="true" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260405_170732_8a9ccda6-5cff-4628-b164-059c500a2b41.mp4"></video>
      <nav class="hero-nav" aria-label="Navegação principal">
        <button type="button" data-view="today">Hoje</button>
        <button type="button" data-view="my-schedule">Minha escala</button>
        <button type="button" data-view="general">Visão geral</button>
      </nav>
      <div class="hero-noise" aria-hidden="true"></div>
      <div class="hero-content">
        <p class="hero-kicker">Residência de Pediatria - Paracatu</p>
        <h1 id="brand-title" class="hero-title"><span>Escala</span><span>Pediatria<sup>✳</sup></span></h1>
        <div class="hero-note"><p>Organize sua rotina, acompanhe sua programação e consulte a escala oficial em um só lugar.</p><button type="button" class="hero-cta" data-view="today">Ver minha escala <span aria-hidden="true">→</span></button></div>
      </div>
    </section>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Consulta de escala</p>
          <h1>Escala Pediatria</h1>
          <p class="header-date" id="header-date"></p>
        </div>
        <div class="header-actions"><span id="profile-indicator" class="profile-indicator" hidden></span><span id="profile-avatar" class="profile-avatar" aria-hidden="true">EP</span><button class="icon-button" type="button" data-action="go-today" aria-label="Voltar para hoje" title="Hoje">Hoje</button><button class="icon-button" type="button" data-action="open-settings" aria-label="Abrir configurações">⚙</button></div>
      </header>
      <main id="app-content" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button type="button" data-view="today" aria-current="page"><span aria-hidden="true">☀</span><span>Hoje</span></button>
      <button type="button" data-view="my-schedule"><span aria-hidden="true">◷</span><span>Minha escala</span></button>
      <button type="button" data-view="general"><span aria-hidden="true">☷</span><span>Visão geral</span></button>
    </nav>

    <dialog id="resident-dialog" aria-labelledby="resident-dialog-title"></dialog>
    <dialog id="detail-dialog" aria-labelledby="detail-dialog-title"></dialog>
    <dialog id="settings-dialog" aria-labelledby="settings-dialog-title"></dialog>
    <div id="toast" role="status" aria-live="polite" hidden></div>

    <script src="js/data/residents.js"></script>
    <script src="js/data/schedule-periods.js"></script>
    <script src="js/data/standard-weeks.js"></script>
    <script src="js/core/dates.js"></script>
    <script src="js/core/rotation.js"></script>
    <script src="js/core/schedule-engine.js"></script>
    <script src="js/storage/local-storage.js"></script>
    <script src="js/core/personal-changes.js"></script>
    <script src="js/core/monthly-schedule.js"></script>
    <script src="js/ui/components.js"></script>
    <script src="js/ui/resident-picker.js"></script>
    <script src="js/ui/settings-view.js"></script>
    <script src="js/ui/toast.js"></script>
    <script src="js/ui/today-view.js"></script>
    <script src="js/ui/calendar-view.js"></script>
    <script src="js/ui/monthly-view.js"></script>
    <script src="js/ui/general-view.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
